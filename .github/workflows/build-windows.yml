name: Build Windows EXE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify runtime imports
        run: python -c "import pint, psutil, network.platform_info, network.arp_scanner"

      - name: Build EXE
        run: python -m PyInstaller --noconfirm pint.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pint-windows-x64
          path: dist/pint.exe
          retention-days: 30
